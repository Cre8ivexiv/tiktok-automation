<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>1080xH Mode Preview</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background: radial-gradient(1200px 800px at 30% 20%, #1b2b55 0%, #0b1020 55%, #070a12 100%);
      color: #e7eefc;
    }
    .wrap { max-width: 1100px; margin: 28px auto; padding: 0 16px; }
    .grid { display: grid; grid-template-columns: 380px 1fr; gap: 16px; }
    .card {
      background: rgba(7, 12, 24, 0.55);
      border: 1px solid rgba(140, 170, 255, 0.18);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      overflow: hidden;
    }
    .card h2 { margin: 0; padding: 14px 16px; font-size: 16px; border-bottom: 1px solid rgba(140,170,255,0.14); }
    .card .body { padding: 14px 16px; }
    label { display: block; font-size: 12px; opacity: 0.9; margin: 10px 0 6px; }
    input, select {
      width: 100%; box-sizing: border-box;
      background: rgba(9, 14, 28, 0.65);
      border: 1px solid rgba(140, 170, 255, 0.18);
      color: #e7eefc;
      padding: 10px 12px;
      border-radius: 12px;
      outline: none;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .hint { font-size: 12px; opacity: 0.75; margin-top: 10px; line-height: 1.35; }
    .previewWrap { padding: 14px 16px; display: grid; place-items: center; }
    .stage {
      width: min(620px, 100%);
      aspect-ratio: 9 / 16;
      display: grid;
      place-items: center;
    }

    /* The "output canvas" (1080 x outputHeight) scaled down to fit stage */
    .frame {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 18px;
      border: 1px solid rgba(140,170,255,0.18);
      background: rgba(0,0,0,0.72);
      overflow: hidden;
    }

    /* Safe-area guides (optional) */
    .guide {
      position: absolute; inset: 0;
      pointer-events: none;
      border: 1px dashed rgba(255,255,255,0.15);
      border-radius: 18px;
      margin: 14px;
    }

    /* The "video content" rectangle */
    .videoRect {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      background: linear-gradient(135deg, rgba(110,160,255,0.55), rgba(160,110,255,0.35));
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
      border-radius: 10px;
      overflow: hidden;
    }
    .videoRect::after {
      content: "SOURCE VIDEO";
      position: absolute;
      left: 10px; top: 10px;
      font-size: 12px;
      opacity: 0.9;
      background: rgba(0,0,0,0.35);
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.12);
    }

    /* Bars (letterbox/pillarbox overlays for visualization) */
    .barTop, .barBottom, .barLeft, .barRight {
      position: absolute; background: rgba(0,0,0,0.9);
      pointer-events: none;
    }

    .meta {
      font-size: 12px; opacity: 0.85; padding: 10px 16px;
      border-top: 1px solid rgba(140,170,255,0.14);
      display: flex; gap: 14px; flex-wrap: wrap;
    }
    .pill {
      background: rgba(9,14,28,0.6);
      border: 1px solid rgba(140,170,255,0.18);
      padding: 6px 10px; border-radius: 999px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="grid">
      <div class="card">
        <h2>Controls</h2>
        <div class="body">
          <label>Output width (fixed)</label>
          <input id="outW" type="number" value="1080" disabled />

          <label>Output height</label>
          <input id="outH" type="number" value="1920" min="200" max="4000" step="1" />

          <div class="row">
            <div>
              <label>Source aspect preset</label>
              <select id="srcPreset">
                <option value="1920:1080" selected>16:9 (1920x1080)</option>
                <option value="1280:720">16:9 (1280x720)</option>
                <option value="1024:768">4:3 (1024x768)</option>
                <option value="1080:1920">9:16 (1080x1920)</option>
                <option value="custom">Custom...</option>
              </select>
            </div>
            <div>
              <label>Mode</label>
              <select id="mode">
                <option value="letterbox" selected>Letterbox (contain)</option>
                <option value="cover">Cover (fill + crop)</option>
                <option value="vzoom">Vertical Zoom (width-locked)</option>
              </select>
            </div>
          </div>

          <div class="row">
            <div>
              <label>Custom source width</label>
              <input id="srcW" type="number" value="1920" min="10" />
            </div>
            <div>
              <label>Custom source height</label>
              <input id="srcH" type="number" value="1080" min="10" />
            </div>
          </div>

          <label>Vertical zoom factor (only for "Vertical Zoom")</label>
          <input id="zoom" type="number" value="2.08" min="0.1" max="10" step="0.01" />

          <label>Edge bar overlay px (visual only)</label>
          <input id="edgeBar" type="number" value="45" min="0" max="500" step="1" />

          <div class="hint">
            This is a <b>visual simulator</b> for layout only.
            It doesn't render FFmpeg - it shows what your frame would look like when you change:
            <b>output height</b>, <b>mode</b>, and <b>zoom</b>.
          </div>
        </div>
      </div>

      <div class="card">
        <h2>Preview (9:16)</h2>
        <div class="previewWrap">
          <div class="stage">
            <div class="frame" id="frame">
              <div class="videoRect" id="videoRect"></div>

              <!-- Bars (computed) -->
              <div class="barTop" id="barTop"></div>
              <div class="barBottom" id="barBottom"></div>
              <div class="barLeft" id="barLeft"></div>
              <div class="barRight" id="barRight"></div>

              <!-- Optional guide -->
              <div class="guide"></div>
            </div>
          </div>
        </div>
        <div class="meta" id="meta"></div>
      </div>
    </div>
  </div>

  <script>
    const el = {
      outH: document.getElementById("outH"),
      srcPreset: document.getElementById("srcPreset"),
      srcW: document.getElementById("srcW"),
      srcH: document.getElementById("srcH"),
      mode: document.getElementById("mode"),
      zoom: document.getElementById("zoom"),
      edgeBar: document.getElementById("edgeBar"),
      frame: document.getElementById("frame"),
      videoRect: document.getElementById("videoRect"),
      meta: document.getElementById("meta"),
      barTop: document.getElementById("barTop"),
      barBottom: document.getElementById("barBottom"),
      barLeft: document.getElementById("barLeft"),
      barRight: document.getElementById("barRight"),
    };

    const OUT_W = 1080;

    function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }
    function even(n){ return Math.floor(n / 2) * 2; }

    function applyPreset(){
      const v = el.srcPreset.value;
      if (v === "custom") return;
      const [w,h] = v.split(":").map(Number);
      el.srcW.value = w;
      el.srcH.value = h;
    }

    function setBars(topPx, bottomPx, leftPx, rightPx){
      // All values are in "output pixels". We convert to percentages of output for responsive drawing.
      const outH = Number(el.outH.value);
      const outW = OUT_W;

      function pctX(px){ return (px / outW) * 100; }
      function pctY(px){ return (px / outH) * 100; }

      const bt = el.barTop, bb = el.barBottom, bl = el.barLeft, br = el.barRight;

      bt.style.left = "0%"; bt.style.top = "0%";
      bt.style.width = "100%"; bt.style.height = pctY(topPx) + "%";
      bt.style.display = topPx > 0 ? "block" : "none";

      bb.style.left = "0%"; bb.style.bottom = "0%";
      bb.style.width = "100%"; bb.style.height = pctY(bottomPx) + "%";
      bb.style.display = bottomPx > 0 ? "block" : "none";

      bl.style.left = "0%"; bl.style.top = "0%";
      bl.style.width = pctX(leftPx) + "%"; bl.style.height = "100%";
      bl.style.display = leftPx > 0 ? "block" : "none";

      br.style.right = "0%"; br.style.top = "0%";
      br.style.width = pctX(rightPx) + "%"; br.style.height = "100%";
      br.style.display = rightPx > 0 ? "block" : "none";
    }

    function render(){
      const outH = Number(el.outH.value);
      const srcW = Math.max(1, Number(el.srcW.value));
      const srcH = Math.max(1, Number(el.srcH.value));
      const mode = el.mode.value;
      const zoom = Number(el.zoom.value);
      const edge = clamp(Number(el.edgeBar.value), 0, 2000);

      // All geometry below is in OUTPUT PIXELS.
      const outW = OUT_W;

      // Compute how source would scale into output depending on mode.
      // We'll produce a content rect (cw,ch) and (optionally) bars/crops.
      let cw = outW, ch = outH;
      let bars = {top:0,bottom:0,left:0,right:0};
      let note = "";

      const srcAR = srcW / srcH;
      const outAR = outW / outH;

      if (mode === "letterbox") {
        // Contain: scale down to fit in both dimensions, no crop.
        const scale = Math.min(outW / srcW, outH / srcH);
        cw = even(srcW * scale);
        ch = even(srcH * scale);

        // Bars are the leftover space.
        const vGap = Math.max(0, outH - ch);
        const hGap = Math.max(0, outW - cw);
        bars.top = Math.floor(vGap/2);
        bars.bottom = vGap - bars.top;
        bars.left = Math.floor(hGap/2);
        bars.right = hGap - bars.left;
        note = "Contain (no crop). Bars appear if source AR != output AR.";
      }

      if (mode === "cover") {
        // Cover: scale up to cover output, then crop overflow.
        const scale = Math.max(outW / srcW, outH / srcH);
        cw = even(srcW * scale);
        ch = even(srcH * scale);
        // No bars; instead there is crop overflow (we just describe it).
        const cropX = Math.max(0, cw - outW);
        const cropY = Math.max(0, ch - outH);
        note = `Cover (crop). Cropping: x=${cropX}px total, y=${cropY}px total.`;
      }

      if (mode === "vzoom") {
        // Your bot's "width locked" idea:
        // 1) fit width to 1080
        const scaleW = outW / srcW;
        const baseH = even(srcH * scaleW);

        // 2) apply vertical zoom factor (only height changes)
        const zH = even(baseH * zoom);

        // 3) crop/pad to output height
        cw = outW;
        ch = zH;
        const cropY = Math.max(0, ch - outH);
        const vGap = Math.max(0, outH - ch);
        note = `Width-locked then vertical-zoom. baseH=${baseH}px, zoomedH=${zH}px. ` +
               (cropY>0 ? `Crops ${cropY}px total vertically.` : `Pads ${vGap}px total vertically.`);
      }

      // Apply "edge bar overlay" visual (does NOT change content geometry; it just darkens).
      // This is like drawbox overlays in FFmpeg.
      setBars(edge, edge, 0, 0);

      // Draw content rect inside frame using percentages relative to output.
      const cwPct = (cw / outW) * 100;
      const chPct = (ch / outH) * 100;

      el.videoRect.style.width = cwPct + "%";
      el.videoRect.style.height = chPct + "%";

      // Meta readout
      el.meta.innerHTML = `
        <div class="pill">Output: ${outW}x${outH}</div>
        <div class="pill">Source: ${srcW}x${srcH} (${srcAR.toFixed(3)} AR)</div>
        <div class="pill">Mode: ${mode}</div>
        <div class="pill">Content rect: ${cw}x${ch}</div>
        <div class="pill">Edge overlay: ${edge}px top/bottom</div>
        <div class="pill">${note}</div>
      `;
    }

    el.srcPreset.addEventListener("change", () => { applyPreset(); render(); });
    ["outH","srcW","srcH","mode","zoom","edgeBar"].forEach(id => el[id].addEventListener("input", render));

    applyPreset();
    render();
  </script>
</body>
</html>
